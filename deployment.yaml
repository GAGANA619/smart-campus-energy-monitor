apiVersion: apps/v1
kind: Deployment
metadata:
name: smart-campus-energy
spec:
replicas: 2

selector:
matchLabels:
app: smart-campus-energy

template:
metadata:
labels:
app: smart-campus-energy

```
spec:
  containers:
    - name: energy-dashboard
      image: smart-campus-energy:v1
      imagePullPolicy: IfNotPresent

      ports:
        - containerPort: 80
```

---

apiVersion: v1
kind: Service
metadata:
name: smart-campus-energy-service

spec:
type: NodePort

selector:
app: smart-campus-energy

ports:
- port: 80
targetPort: 80
nodePort: 30080
